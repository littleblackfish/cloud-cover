<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Celestial Dome Octas</title>
  <meta name="description" content="Interactive 3D trainer for estimating cloud amount in octas on the celestial dome.">
  <link rel="stylesheet" href="css/style.css">
  <script type="importmap">
    { "imports": { "three": "./vendor/three.module.min.js" } }
  </script>
</head>
<body>
  <div class="app">
    <main class="stage">
      <canvas id="view" aria-label="3D view of the celestial dome"></canvas>

      <div class="view-switch" role="group" aria-label="Viewpoint">
        <button data-view="outside" class="on">Outside the dome</button>
        <button data-view="inside">Inside (observer)</button>
        <button id="reset-view" title="Reset camera">Reset</button>
      </div>
      <p class="hint" id="view-hint">Drag to orbit · scroll to zoom</p>

      <figure class="skymap">
        <canvas id="skymap" width="440" height="440" aria-label="All-sky map"></canvas>
        <figcaption class="readout" id="readout" aria-live="polite"></figcaption>
      </figure>
    </main>

    <div class="stage-tools">
      <button id="panel-toggle" aria-controls="panel" aria-expanded="true"
        title="Hide the controls">Hide controls</button>
    </div>
    <aside class="panel" id="panel">

      <nav class="tabs" role="tablist">
        <button role="tab" data-tab="octas" class="on">Celestial dome</button>
        <button role="tab" data-tab="layer">Cloud layer</button>
        <button role="tab" data-tab="quiz">Quiz</button>
      </nav>

      <!-- ===================================================== OCTAS -->
      <section class="tab" id="tab-octas">
        <div class="field">
          <span>Coverage <span><output id="octas-out">1</output> / 8</span></span>
          <div class="chips" id="octa-chips"></div>
        </div>

        <fieldset class="field">
          <legend>Shape</legend>
          <div class="seg" id="shape">
            <button data-shape="lying">Slice</button>
            <button data-shape="cap" class="on">Patch</button>
          </div>
        </fieldset>

        <div class="pair">
          <label class="field">
            <span>Azimuth <output id="azimuth-out">270°</output></span>
            <input type="range" id="azimuth" min="0" max="359" step="1" value="270">
          </label>
          <label class="field">
            <span>Elevation <output id="elevation-out">60°</output></span>
            <input type="range" id="elevation" min="0" max="180" step="1" value="60">
          </label>
        </div>
        <fieldset class="field">
          <legend>Guides on the dome</legend>
          <div class="seg" id="guides">
            <button data-guides="none">None</button>
            <button data-guides="slices">8 horizontal slices</button>
            <button data-guides="lying" class="on">8 vertical slices</button>
          </div>
        </fieldset>
      </section>

      <!-- ===================================================== LAYER -->
      <section class="tab" id="tab-layer" hidden>
        <div class="field">
          <span>Coverage <output id="lcover-out"></output></span>
          <div class="chips" id="lcover-chips"></div>
        </div>

        <div class="field">
          <span>Cloud type <output id="ltype-out"></output></span>
          <div class="types" id="ltypes"></div>
          <div class="type-info" id="type-info" hidden>
            <p><span class="tag">Standard</span> <span id="type-std"></span></p>
            <p><span class="tag">Empirical</span> <span id="type-emp"></span></p>
          </div>
        </div>

        <div class="pair">
          <label class="field">
            <span>Azimuth <output id="laz-out">270°</output></span>
            <input type="range" id="laz" min="0" max="359" step="1" value="270">
          </label>
          <label class="field" id="f-lcentre">
            <span>Elevation <output id="lcentre-out">60°</output></span>
            <input type="range" id="lcentre" min="0" max="180" step="1" value="60">
          </label>
        </div>

        <label class="field">
          <span>Cloud base height <output id="lbase-out"></output></span>
          <input type="range" id="lbase" min="100" max="39000" step="100" value="4000">
          <canvas class="freq-strip" id="lbase-freq" height="14" aria-hidden="true"
            title="How often observers report each base for this type"></canvas>
        </label>

        <div class="field sun">
          <span>Sun <output id="sun-out"></output></span>
          <div class="seg" id="season">
            <button data-season="spring">Spring</button>
            <button data-season="summer" class="on">Summer</button>
            <button data-season="autumn">Autumn</button>
            <button data-season="winter">Winter</button>
          </div>
          <div class="row sun-where">
            <button id="sun-locate" title="Use this device's location (the browser asks first)">Use my location</button>
            <input type="date" id="sun-date" aria-label="Date">
          </div>
          <p class="help" id="sun-place"></p>
          <input type="range" id="sun-time" min="0" max="1000" step="1" value="400" aria-label="Time of day, sunrise to sunset">
          <div class="sun-ends" aria-hidden="true"><span id="sun-rise"></span><span id="sun-set"></span></div>
        </div>
      </section>

      <!-- ===================================================== QUIZ -->
      <section class="tab" id="tab-quiz" hidden>
        <div class="row">
          <button id="quiz-new" class="primary">New sky</button>
        </div>
        <p class="quiz-base" id="quiz-base"></p>
        <div class="field">
          <span>Amount (octas)</span>
          <div class="chips answer" id="quiz-answers"></div>
        </div>
        <div class="field">
          <span>Cloud type <small class="dim">optional</small></span>
          <div class="type-chips quiz-types" id="quiz-types"></div>
        </div>
        <div class="row">
          <button id="quiz-check" class="primary" disabled>Check</button>
        </div>
        <p class="quiz-result" id="quiz-result" aria-live="polite"></p>
        <p class="score" id="quiz-score"></p>
      </section>

    </aside>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
